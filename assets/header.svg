<svg fill="none" viewBox="0 0 854 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="220" fill="url(#bgGradient)"/>

  <!-- Subtle tech grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="35" x2="854" y2="35"/>
    <line x1="0" y1="75" x2="854" y2="75"/>
    <line x1="0" y1="115" x2="854" y2="115"/>
    <line x1="0" y1="155" x2="854" y2="155"/>
    <line x1="120" y1="0" x2="120" y2="220"/>
    <line x1="280" y1="0" x2="280" y2="220"/>
    <line x1="440" y1="0" x2="440" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="760" y1="0" x2="760" y2="220"/>
  </g>

  <!-- Waving Paths -->
  <path d="M0,170 C150,140 300,195 450,165 C600,135 720,185 854,160 L854,220 L0,220 Z" fill="url(#waveGradient1)"/>
  <path d="M0,185 C180,160 320,205 480,180 C640,155 750,195 854,180 L854,220 L0,220 Z" fill="url(#waveGradient2)"/>

  <!-- Glowing accent dots -->
  <circle cx="140" cy="55" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="720" cy="45" r="2.5" fill="#a855f7" opacity="0.8"/>
  <circle cx="680" cy="90" r="1.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="180" cy="110" r="1.5" fill="#818cf8" opacity="0.6"/>

  <!-- Main Name Title -->
  <text x="50%" y="90" text-anchor="middle" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="1">Mrityunjay Kushwaha</text>

  <!-- Subtitle -->
  <text x="50%" y="130" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.5">Full-Stack Engineer &#8226; AI Systems &amp; Automations</text>
</svg>